<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoversCrafter Insurance Automation</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="hub">
    <header class="hub-header">
      <img src="icons/icon48.png" alt="" class="hub-logo" width="40" height="40">
      <div>
        <h1>CoversCrafter</h1>
        <p class="hub-subtitle">Select an insurer to automate</p>
      </div>
    </header>

    <div class="provider-grid">
      <button type="button" class="provider-card" data-provider="bajaj">
        <span class="provider-icon">🛡️</span>
        <span class="provider-name">Bajaj General</span>
        <span class="provider-desc">portal.bajajgeneral.com</span>
      </button>
      <button type="button" class="provider-card" data-provider="icici">
        <span class="provider-icon">🏦</span>
        <span class="provider-name">ICICI Lombard</span>
        <span class="provider-desc">nysa.icicilombard.com</span>
      </button>
      <button type="button" class="provider-card" data-provider="sompo">
        <span class="provider-icon">🌐</span>
        <span class="provider-name">Universal Sompo</span>
        <span class="provider-desc">agencyforce.universalsompo.com</span>
      </button>
      <button type="button" class="provider-card" data-provider="oriental">
        <span class="provider-icon">🏛️</span>
        <span class="provider-name">Oriental Insurance</span>
        <span class="provider-desc">orientalinsurance.org.in</span>
      </button>
    </div>

    <footer class="hub-footer">
      <a href="#" id="open-settings">⚙️ Settings</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
