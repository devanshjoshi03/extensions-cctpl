<!DOCTYPE html>
<html><head>
  <meta charset="UTF-8">
  <title>Universal BAJAJ Extension Settings</title>
  <link rel="stylesheet" href="config.css">
</head><body>
  <div class="container">
    <h1>⚙️ BAJAJ Extension Settings</h1>
    <div class="section">
      <h2>OpenAI (CAPTCHA Solver)</h2>
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="api-key" placeholder="sk-..." />
      </div>
      <div class="form-group">
        <label>Model</label>
        <select id="model">
          <option value="gpt-4o">gpt-4o</option>
          <option value="gpt-4o-mini">gpt-4o-mini</option>
          <option value="gpt-4-turbo">gpt-4-turbo</option>
        </select>
      </div>
    </div>
    <div class="section">
      <h2>OTP Service</h2>
      <div class="form-group">
        <label>OTP Email</label>
        <input type="text" id="otp-email" value="otpcoverscrafter@gmail.com" />
      </div>
      <div class="form-group">
        <label>OTP Label</label>
        <input type="text" id="otp-label" value="UNIVERSAL_BAJAJ" />
      </div>
      <div class="form-group">
        <label>OTP API Base URL</label>
        <input type="text" id="otp-api" value="https://otpservice.coverscrafter.com/api/v1/otp" />
      </div>
    </div>
    <button id="save-btn" class="btn">💾 Save Settings</button>
    <div id="status" class="status hidden"></div>
  </div>
  <script src="config.js"></script>
</body></html>
