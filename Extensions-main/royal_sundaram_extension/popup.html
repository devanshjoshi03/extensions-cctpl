<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Sundaram Insurance Automation</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon48.svg" alt="" class="logo">
      <h1>Royal Sundaram Insurance</h1>
    </div>

    <div class="section">
      <textarea id="json-input" rows="18" placeholder="Paste JSON payload here..."></textarea>
    </div>

    <div class="actions">
      <button id="start-btn" class="btn btn-primary">Start</button>
    </div>

    <div id="automation-controls" class="controls-row" style="display:none;">
      <button id="pause-btn" class="btn btn-ctrl btn-pause" disabled>Pause</button>
      <button id="resume-btn" class="btn btn-ctrl btn-resume" disabled style="display:none;">Resume</button>
      <button id="stop-btn" class="btn btn-ctrl btn-stop" disabled>Stop</button>
    </div>

    <div id="auto-status" class="auto-status" style="display:none;">
      <div class="auto-status-row">
        <span id="auto-badge" class="auto-badge idle">Idle</span>
        <span id="auto-step" class="auto-step">-</span>
      </div>
    </div>

    <div id="status" class="status hidden"></div>

    <div class="section">
      <label for="logs-output">Live Logs:</label>
      <div id="logs-output" class="logs-output"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
