<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Policy Print Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Policy Print Saver</h1>
    </header>

    <button id="start-btn" class="start-btn" type="button">Start</button>

    <div id="status" class="status hidden"></div>

    <section class="logs-section" aria-label="Live Logs">
      <div class="logs-title">Live Logs</div>
      <div id="logs-output" class="logs-output"></div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
