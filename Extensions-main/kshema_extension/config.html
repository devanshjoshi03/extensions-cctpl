<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kshema Extension Settings</title>
  <link rel="stylesheet" href="config.css">
</head>
<body>
  <div class="container">
    <h1>Kshema Extension Settings</h1>
    <div class="section">
      <h2>OpenAI</h2>
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="api-key" placeholder="sk-..." />
      </div>
      <div class="form-group">
        <label>Model</label>
        <select id="model">
          <option value="gpt-4o">gpt-4o</option>
          <option value="gpt-4o-mini">gpt-4o-mini</option>
          <option value="gpt-4-turbo">gpt-4-turbo</option>
        </select>
      </div>
    </div>
    <div class="section">
      <h2>Kshema Agent</h2>
      <div class="form-group">
        <label>Default Username</label>
        <input type="text" id="default-username" placeholder="Enter username" />
      </div>
      <div class="form-group">
        <label>Default Password</label>
        <input type="password" id="default-password" placeholder="Enter password" />
      </div>
    </div>
    <button id="save-btn" class="btn">Save Settings</button>
    <div id="status" class="status hidden"></div>
  </div>
  <script src="config.js"></script>
</body>
</html>
